[project]
name = "arxiv-daily"
version = "0.1.0"
description = "Daily arXiv paper reader and summarizer"
dependencies = [
    "feedparser>=6.0.10",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.arxiv-daily]
categories = ["cs.OS", "cs.PL", "cs.SE", "cs.AI"]
max_papers_per_category = 10